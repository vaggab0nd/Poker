<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOOM — a side quest from the poker table</title>
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #000;
        color: #d9d4c7;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        overflow: hidden;
      }
      .bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 8px 14px;
        background: linear-gradient(180deg, #1a1a1a, #0d0d0d);
        border-bottom: 1px solid #2a2a2a;
        font-size: 12px;
      }
      .bar .title {
        font-weight: 900;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      .bar .title .red { color: #e23b3b; }
      .bar .title .dim { color: #7a7466; }
      .bar a {
        color: #d4a24a;
        text-decoration: none;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .bar a:hover { color: #f0c56a; }
      #dos {
        position: absolute;
        top: 34px;
        left: 0;
        right: 0;
        bottom: 0;
      }
      .fallback {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        max-width: 520px;
        text-align: center;
        line-height: 1.5;
        padding: 24px;
      }
      .fallback h1 {
        color: #e23b3b;
        letter-spacing: 0.2em;
        margin: 0 0 12px;
      }
      .fallback code {
        background: #1a1a1a;
        padding: 2px 6px;
        border-radius: 3px;
        color: #d4a24a;
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <div class="title">
        <span class="red">DOOM</span>
        <span class="dim">// in a browser tab, powered by js-dos</span>
      </div>
      <a href="/">&larr; back to poker</a>
    </div>
    <div id="dos"></div>
    <div id="fallback" class="fallback" style="display:none">
      <h1>js-dos didn't load</h1>
      <p>
        The runtime is served from <code>v8.js-dos.com</code>. If your network
        or an extension is blocking it, try disabling the blocker and reload.
      </p>
    </div>
    <script src="https://v8.js-dos.com/latest/js-dos.js"></script>
    <script>
      window.addEventListener('load', function () {
        if (typeof Dos !== 'function') {
          document.getElementById('fallback').style.display = 'block';
          return;
        }
        Dos(document.getElementById('dos'), {
          url: 'https://js-dos.com/cdn/upload/DOOM-@evilution.zip',
          theme: 'dark',
        });
      });
    </script>
  </body>
</html>
